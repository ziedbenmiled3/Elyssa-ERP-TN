<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich twilight/dark indigo gradient -->
    <linearGradient id="bg-gradient-favicon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Soft indigo to amber accent glow -->
    <linearGradient id="accent-glow-favicon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Rich shiny gold gradient for the Phoenician boat/crown -->
    <linearGradient id="gold-grad-favicon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gold-grad-mid-favicon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="gold-grad-light-favicon" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Soft glow filter for the Mast star -->
    <filter id="star-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid rounded corner container -->
  <rect width="512" height="512" fill="url(#bg-gradient-favicon)" rx="128"/>
  
  <!-- Outer metallic accent border -->
  <rect width="496" height="496" x="8" y="8" fill="none" stroke="url(#accent-glow-favicon)" stroke-width="4" stroke-opacity="0.2" rx="120" />

  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accent-glow-favicon)" stroke-width="6" stroke-opacity="0.15"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent-glow-favicon)" stroke-width="3" stroke-opacity="0.1"/>

  <!-- Scaled up Phoenician Galley & Crown group (from 120x120 model translated/scaled into center) -->
  <g transform="translate(48, 48) scale(3.46)">
    <!-- Stylized sail or crown peaks -->
    <path d="M34,42 L42,26 L54,34 L66,26 L74,42 Z" fill="url(#gold-grad-favicon)" />
    
    <!-- The elegant golden sails -->
    <path d="M34,46 Q44,46 54,40 Q54,58 34,70 Z" fill="url(#gold-grad-light-favicon)" />
    <path d="M74,46 Q64,46 54,40 Q54,58 74,70 Z" fill="url(#gold-grad-mid-favicon)" />
    
    <!-- The sleek hull of the Phoenician boat in gleaming gold -->
    <path d="M26,74 C40,84 68,84 82,74 C86,72 88,74 86,76 C80,88 28,88 22,76 C20,74 22,72 26,74 Z" fill="url(#gold-grad-favicon)" />
    
    <!-- Bright white star at masthead -->
    <circle cx="54" cy="20" r="3.5" fill="#ffffff" filter="url(#star-glow)"/>
  </g>
</svg>
